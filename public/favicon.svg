    AE
  </text>
  
  <!-- Code Lines -->
  <rect x="12" y="48" width="16" height="3" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="32" y="48" width="20" height="3" rx="1.5" fill="white" opacity="0.7"/>
